name: Validate Test Bank

on:
  push:
    paths:
      - 'docs/test-bank/**'
      - 'tools/generate-test-bank-mapping.mjs'
      - 'tools/validate-test-bank.mjs'
      - '.github/workflows/validate-test-bank.yml'
  pull_request:
    paths:
      - 'docs/test-bank/**'
      - 'tools/generate-test-bank-mapping.mjs'
      - 'tools/validate-test-bank.mjs'
      - '.github/workflows/validate-test-bank.yml'
  workflow_dispatch:

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate document structure
        run: node tools/validate-test-bank.mjs
      - name: Check mapping drift
        run: node tools/generate-test-bank-mapping.mjs --check
