<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- Nen trang -->
  <rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"/>

  <!-- Khung he thong -->
  <rect id="system-boundary" x="300" y="30" width="1580" height="1020" rx="28" fill="#FFFFFF" stroke="#0D9488" stroke-width="2.5"/>
  <text x="1090" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#0D9488">Hệ thống DSA-Visual</text>

  <!-- Duong noi: Giang vien (Teacher) -->
  <g id="lines-giang-vien" stroke="#6B7280" stroke-width="1.5">
    <line x1="212" y1="540" x2="505" y2="380"/>
    <line x1="212" y1="540" x2="895" y2="380"/>
    <line x1="212" y1="540" x2="1285" y2="380"/>
    <line x1="212" y1="540" x2="1675" y2="380"/>
    <line x1="212" y1="540" x2="700" y2="700"/>
    <line x1="212" y1="540" x2="1090" y2="700"/>
    <line x1="212" y1="540" x2="1480" y2="700"/>
  </g>

  <!-- Tac nhan: Giang vien (Teacher) -->
  <g id="actor-giang-vien">
    <circle cx="170" cy="540" r="22" fill="#FFFFFF" stroke="#0D9488" stroke-width="5"/>
    <line x1="170" y1="562" x2="170" y2="608" stroke="#0D9488" stroke-width="5" stroke-linecap="round"/>
    <line x1="138" y1="580" x2="202" y2="580" stroke="#0D9488" stroke-width="5" stroke-linecap="round"/>
    <line x1="170" y1="608" x2="148" y2="652" stroke="#0D9488" stroke-width="5" stroke-linecap="round"/>
    <line x1="170" y1="608" x2="192" y2="652" stroke="#0D9488" stroke-width="5" stroke-linecap="round"/>
    <text x="170" y="685" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0D9488">Giảng viên</text>
    <text x="170" y="710" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4B5563">(Teacher)</text>
  </g>

  <!-- 7 Use cases -->
  <g id="uc-09"><ellipse cx="505" cy="380" rx="170" ry="46" fill="#E6F7F5" stroke="#0D9488" stroke-width="1.5"/>
    <text x="505" y="371" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">UC-09</text>
    <text x="505" y="396" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5" fill="#1F2937">Biên soạn bài học</text></g>
  <g id="uc-10"><ellipse cx="895" cy="380" rx="170" ry="46" fill="#E6F7F5" stroke="#0D9488" stroke-width="1.5"/>
    <text x="895" y="371" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">UC-10</text>
    <text x="895" y="396" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5" fill="#1F2937">Biên soạn bài tập</text></g>
  <g id="uc-11"><ellipse cx="1285" cy="380" rx="170" ry="46" fill="#E6F7F5" stroke="#0D9488" stroke-width="1.5"/>
    <text x="1285" y="371" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">UC-11</text>
    <text x="1285" y="396" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5" fill="#1F2937">Xem báo cáo giảng dạy</text></g>
  <g id="uc-20"><ellipse cx="1675" cy="380" rx="170" ry="46" fill="#E6F7F5" stroke="#0D9488" stroke-width="1.5"/>
    <text x="1675" y="371" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">UC-20</text>
    <text x="1675" y="396" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5" fill="#1F2937">Quản lý lớp học phần</text></g>
  <g id="uc-04"><ellipse cx="700" cy="700" rx="170" ry="46" fill="#E6F7F5" stroke="#0D9488" stroke-width="1.5"/>
    <text x="700" y="691" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">UC-04</text>
    <text x="700" y="716" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5" fill="#1F2937">Xem bài học</text></g>
  <g id="uc-05"><ellipse cx="1090" cy="700" rx="170" ry="46" fill="#E6F7F5" stroke="#0D9488" stroke-width="1.5"/>
    <text x="1090" y="691" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">UC-05</text>
    <text x="1090" y="716" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5" fill="#1F2937">Tìm kiếm bài học</text></g>
  <g id="uc-24"><ellipse cx="1480" cy="700" rx="170" ry="46" fill="#E6F7F5" stroke="#0D9488" stroke-width="1.5"/>
    <text x="1480" y="691" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">UC-24</text>
    <text x="1480" y="716" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5" fill="#1F2937">Gửi phản hồi và báo lỗi</text></g>
</svg>
