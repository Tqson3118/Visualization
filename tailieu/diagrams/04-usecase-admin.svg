<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- Nen trang -->
  <rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"/>

  <!-- Khung he thong -->
  <rect id="system-boundary" x="300" y="30" width="1580" height="1020" rx="28" fill="#FFFFFF" stroke="#0D9488" stroke-width="2.5"/>
  <text x="1090" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#0D9488">Hệ thống DSA-Visual</text>

  <!-- Duong noi: Quan tri vien (Admin) -->
  <g id="lines-admin" stroke="#6B7280" stroke-width="1.5">
    <line x1="212" y1="540" x2="1090" y2="420"/>
    <line x1="212" y1="540" x2="1090" y2="600"/>
    <line x1="212" y1="540" x2="1090" y2="780"/>
  </g>

  <!-- Tac nhan: Quan tri vien (Admin) -->
  <g id="actor-admin">
    <circle cx="170" cy="540" r="22" fill="#FFFFFF" stroke="#0D9488" stroke-width="5"/>
    <line x1="170" y1="562" x2="170" y2="608" stroke="#0D9488" stroke-width="5" stroke-linecap="round"/>
    <line x1="138" y1="580" x2="202" y2="580" stroke="#0D9488" stroke-width="5" stroke-linecap="round"/>
    <line x1="170" y1="608" x2="148" y2="652" stroke="#0D9488" stroke-width="5" stroke-linecap="round"/>
    <line x1="170" y1="608" x2="192" y2="652" stroke="#0D9488" stroke-width="5" stroke-linecap="round"/>
    <text x="170" y="685" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0D9488">Quản trị viên</text>
    <text x="170" y="710" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4B5563">(Admin)</text>
  </g>

  <!-- 3 Use cases -->
  <g id="uc-12"><ellipse cx="1090" cy="420" rx="180" ry="46" fill="#E6F7F5" stroke="#0D9488" stroke-width="1.5"/>
    <text x="1090" y="411" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">UC-12</text>
    <text x="1090" y="436" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5" fill="#1F2937">Quản lý người dùng</text></g>
  <g id="uc-13"><ellipse cx="1090" cy="600" rx="180" ry="46" fill="#E6F7F5" stroke="#0D9488" stroke-width="1.5"/>
    <text x="1090" y="591" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">UC-13</text>
    <text x="1090" y="616" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5" fill="#1F2937">Quản trị cấu hình</text></g>
  <g id="uc-24"><ellipse cx="1090" cy="780" rx="180" ry="46" fill="#E6F7F5" stroke="#0D9488" stroke-width="1.5"/>
    <text x="1090" y="771" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">UC-24</text>
    <text x="1090" y="796" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5" fill="#1F2937">Gửi phản hồi và báo lỗi</text></g>
</svg>
