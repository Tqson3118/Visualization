# ── Docker Compose dev (SDD §5.6 / DEPLOY §3.3) — SQL Server + MailHog + backend + frontend ──
# KHÔNG Postgres/Redis/Judge0/Cloudinary — viết MỚI (không bê docker-compose V1).
# Chạy: docker compose up -d --build

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-DsaVisual@Dev123}   # placeholder dev — đổi khi deploy
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # UI xem email dev

  backend:
    build: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DSA__Jwt__Secret: ${DSA__Jwt__Secret:-change-me-dev-secret-0123456789abcdef}
      ConnectionStrings__Default: Server=sqlserver;Database=DsaVisual;User Id=sa;Password=${MSSQL_SA_PASSWORD:-DsaVisual@Dev123};TrustServerCertificate=True
      DSA__Cors__AllowedOrigins: http://localhost:8081
      DSA__Email__SmtpHost: mailhog
      DSA__Email__SmtpPort: "1025"
      DSA__Email__UseMailHog: "${DSA__EMAIL__USE_MAILHOG:-true}"
      DSA__Email__SmtpUsername: "${DSA__EMAIL__SMTP_USERNAME:-}"
      DSA__Email__SmtpPassword: "${DSA__EMAIL__SMTP_PASSWORD:-}"
    ports:
      - "5000:8080"   # host 5000 (DEPLOY §2.3) → container 8080
    depends_on:
      sqlserver:
        condition: service_healthy
      mailhog:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "8081:8080"   # SPA + proxy /api → backend:8080
    depends_on:
      - backend

volumes:
  sqlserver-data:

