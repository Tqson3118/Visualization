version: '3.8'

services:
  # ── 1. Database: Microsoft SQL Server 2022 ─────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dsavisual-sqlserver
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Passw0rd!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - dsavisual-network

  # ── 2. Local SMTP Catcher (MailHog) ────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: dsavisual-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI
    networks:
      - dsavisual-network

  # ── 3. Backend API: ASP.NET Core (.NET 10) ────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dsavisual-backend
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=DsaVisualDb;User Id=sa;Password=YourStrong@Passw0rd!;TrustServerCertificate=True;MultipleActiveResultSets=true;
      - DSA__Jwt__Secret=dsa-visual-super-secret-key-at-least-32-chars-long!
      - DSA__Jwt__Issuer=DsaVisual
      - DSA__Jwt__Audience=DsaVisualApp
      - DSA__Jwt__AccessTokenLifetimeMinutes=60
      - DSA__Jwt__RefreshTokenLifetimeDays=7
      - DSA__Smtp__Host=mailhog
      - DSA__Smtp__Port=1025
      - DSA__Smtp__EnableSsl=false
      - DSA__Smtp__FromEmail=noreply@dsavisual.edu.vn
      - DSA__Smtp__FromName=DSA Visual
      - DSA__Cors__AllowedOrigins__0=http://localhost
      - DSA__Cors__AllowedOrigins__1=http://localhost:80
      - DSA__Cors__AllowedOrigins__2=http://localhost:5173
      - DSA__Cors__AllowedOrigins__3=http://localhost:3000
    ports:
      - "5000:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - dsavisual-network

  # ── 4. Frontend SPA: Vue 3 + Nginx ─────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api/v1
    container_name: dsavisual-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:8080"
      - "3000:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - dsavisual-network

volumes:
  sqlserver-data:
    driver: local

networks:
  dsavisual-network:
    driver: bridge
