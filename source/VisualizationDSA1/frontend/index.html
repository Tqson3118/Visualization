<!doctype html>
<html lang="vi" data-theme="dark">
  <head>
    <meta charset="UTF-8" />

    <!-- ── O2/O5: SEO & Discovery Meta ── -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="VisualizationDSA — Nền tảng học và trực quan hóa Cấu trúc dữ liệu & Giải thuật (DSA). Học tương tác, quiz, lộ trình cá nhân, sandbox code trực tiếp." />

    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VisualizationDSA" />

    <meta property="og:url" content="https://visualizationdsa.dev" />

    <meta property="og:site_name" content="VisualizationDSA" />

    <meta name="twitter:title" content="VisualizationDSA — Học DSA Trực Quan" />

    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
